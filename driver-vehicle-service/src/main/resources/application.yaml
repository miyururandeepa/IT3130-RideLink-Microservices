server:
  port: 8082

spring:
  application:
    name: driver-vehicle-service

  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/driver_vehicle_db}"
    username: "${DB_USER:postgres}"
    password: "${DB_PASSWORD:123456}"
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  output:
    ansi:
      enabled: always

  main:
    banner-mode: off

jwt:
  secret: mySecretKey1234567890123456789012345678901234567890

logging:
  level:
    root: WARN
    com.ridelink: INFO
  pattern:
    console: "%clr(%d{HH:mm:ss}){faint} %clr(%-5level) %clr(%logger{0}){cyan} : %msg%n"
